    <!-- <header class="py-5 bg-light text-center">
      <div class="container">
        <h1 class="display-4 fw-bold mb-0">Todas Nuestras Actividades</h1>

    <!-- Hero Section for Activities -->
    <section class="activities-hero-section">
      <div class="hero-content">
        <h1 class="hero-title">Nuestras Actividades</h1>
        <p class="hero-subtitle">Programas de rehabilitación integral</p>
      </div>
    </section>

    <section id="actividades" class="activities-section py-5">
      <div class="container">
        <div id="activities-container-full"></div>
      </div>
    </section>

    <div
      class="modal fade"
      id="imageModal"
      tabindex="-1"
      aria-labelledby="imageModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar galería"
            ></button>
          </div>
          <div class="modal-body text-center">
            <div class="image-container position-relative">
              <img
                id="modalImage"
                src=""
                alt="Imagen de la actividad"
                class="img-fluid"
              />
              <button
                class="btn btn-light position-absolute top-50 start-0 translate-middle-y ms-3"
                id="prevBtn"
                aria-label="Imagen anterior"
              >
                <i class="fas fa-chevron-left" aria-hidden="true"></i>
              </button>
              <button
                class="btn btn-light position-absolute top-50 end-0 translate-middle-y me-3"
                id="nextBtn"
                aria-label="Imagen siguiente"
              >
                <i class="fas fa-chevron-right" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer bg-dark text-white text-center py-3 mt-5">
      <div class="container">
        <p class="mb-0">Programa de Rehabilitación © 2025</p>
      </div>
    </footer>

    <script

    <script src="https://unpkg.com/aos@next/dist/aos.js" defer></script>
    <script type="module" src="actividades.js" defer></script>
  </body>
